name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: chmod +x gradlew && ./gradlew clean build --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: oplicense-client-build
          path: build/libs/*.jar
          if-no-files-found: error

  publish-snapshot:
    name: Publish snapshot
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: REPO
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Publish to snapshots
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          if [ -z "${REPOSILITE_USER}" ] || [ -z "${REPOSILITE_TOKEN}" ]; then
            echo "Missing REPOSILITE_USER / REPOSILITE_TOKEN in environment REPO."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew publish -Preposilite.target=snapshots --no-daemon
