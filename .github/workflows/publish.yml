name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional, defaults to project version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    name: Publish to releases
    runs-on: ubuntu-latest
    environment: REPO

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve version
        id: meta
        run: |
          chmod +x gradlew
          PROJECT_VERSION="$(./gradlew -q printVersion -Preposilite.target=releases)"
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          else
            VERSION="$PROJECT_VERSION"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version=${VERSION}"

      - name: Publish to releases
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_TOKEN: ${{ secrets.REPOSILITE_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew clean publish \
            -Preposilite.target=releases \
            -Pversion=${{ steps.meta.outputs.version }} \
            --no-daemon

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
